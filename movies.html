<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<main class="container mt-5">

  <h2 class="mb-4 text-center">🎬 My Top Movies</h2>

  <div class="row g-4">

    <!-- DUNE -->
    <div class="col-md-4">
      <div class="card shadow-lg h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/8/8e/Dune_%282021_film%29.jpg" class="card-img-top" alt="Dune">
        <div class="card-body">
          <h5 class="card-title">Dune (2021)</h5>
          <p>IMDb: 8.0 / 10</p>
          <a href="https://www.imdb.com/title/tt1160419/" target="_blank" class="btn btn-primary btn-sm">IMDb</a>
        </div>
      </div>
    </div>

    <!-- SPIDER-MAN -->
    <div class="col-md-4">
      <div class="card shadow-lg h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/0/02/Amazing_Spider-Man_poster.jpg" class="card-img-top" alt="Spider-Man">
        <div class="card-body">
          <h5 class="card-title">The Amazing Spider-Man</h5>
          <p>IMDb: 6.9 / 10</p>
          <a href="https://www.imdb.com/title/tt0948470/" target="_blank" class="btn btn-primary btn-sm">IMDb</a>
        </div>
      </div>
    </div>

    <!-- RUSH HOUR -->
    <div class="col-md-4">
      <div class="card shadow-lg h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/55/Rush_hour_ver1.jpg" class="card-img-top" alt="Rush Hour">
        <div class="card-body">
          <h5 class="card-title">Rush Hour</h5>
          <p>IMDb: 7.0 / 10</p>
          <a href="https://www.imdb.com/title/tt0120812/" target="_blank" class="btn btn-primary btn-sm">IMDb</a>
        </div>
      </div>
    </div>

  </div>
</main>

<script src="init.js"></script>
</body>
</html>
