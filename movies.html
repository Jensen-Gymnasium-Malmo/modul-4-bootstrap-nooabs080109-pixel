<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header class="bg-primary text-white text-center p-5">
  <h1>🎬 Movies</h1>
</header>

<main class="container mt-5">

  <div class="row g-4">

    <div class="col-md-4">
      <div class="card shadow-lg h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/8/8e/Dune_%282021_film%29.jpg" class="img-fluid">
        <div class="card-body">
          <h5>Dune</h5>
          <p>⭐ 8.0</p>
          <button class="btn btn-warning" data-bs-toggle="collapse" data-bs-target="#d1">More</button>
          <div class="collapse" id="d1">Epic sci-fi film.</div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-lg h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/0/02/Amazing_Spider-Man_poster.jpg" class="img-fluid">
        <div class="card-body">
          <h5>Spider-Man</h5>
          <p>⭐ 6.9</p>
          <button class="btn btn-warning" data-bs-toggle="collapse" data-bs-target="#d2">More</button>
          <div class="collapse" id="d2">Hero story.</div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-lg h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/55/Rush_hour_ver1.jpg" class="img-fluid">
        <div class="card-body">
          <h5>Rush Hour</h5>
          <p>⭐ 7.0</p>
          <button class="btn btn-warning" data-bs-toggle="collapse" data-bs-target="#d3">More</button>
          <div class="collapse" id="d3">Action comedy.</div>
        </div>
      </div>
    </div>

  </div>

</main>

<script src="init.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
