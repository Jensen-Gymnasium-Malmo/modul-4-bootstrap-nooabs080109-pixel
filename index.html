<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Favorites</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<main>

  <!-- HERO SECTION -->
  <section class="bg-primary text-white text-center p-5">
    <div class="container">
      <h1 class="display-4">🎬 My Favorites</h1>
      <p class="lead">Movies • Series • Music</p>
      <p>En sida med mina toppval inom film, serier och musik</p>
    </div>
  </section>

  <!-- CARDS -->
  <section class="container mt-5">

    <div class="row g-4">

      <!-- MOVIES -->
      <div class="col-md-4">
        <div class="card shadow h-100 text-center">
          <div class="card-body">
            <h3>🎬 Movies</h3>
            <p>Se mina topp 3 filmer</p>
            <a href="movies.html" class="btn btn-primary">Go to Movies</a>
          </div>
        </div>
      </div>

      <!-- SERIES -->
      <div class="col-md-4">
        <div class="card shadow h-100 text-center">
          <div class="card-body">
            <h3>📺 Series</h3>
            <p>Se mina favoritserier</p>
            <a href="series.html" class="btn btn-warning">Go to Series</a>
          </div>
        </div>
      </div>

      <!-- MUSIC -->
      <div class="col-md-4">
        <div class="card shadow h-100 text-center">
          <div class="card-body">
            <h3>🎵 Music</h3>
            <p>Min favoritartist och låtar</p>
            <a href="music.html" class="btn btn-success">Go to Music</a>
          </div>
        </div>
      </div>

    </div>

  </section>

</main>

<!-- JS (HEADER + FOOTER kommer från init.js) -->
<script src="init.js"></script>

</body>
</html>
