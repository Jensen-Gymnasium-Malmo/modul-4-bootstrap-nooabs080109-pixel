<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header class="bg-info text-white text-center p-5">
  <h1>📺 Series</h1>
</header>

<main class="container mt-5">

  <div class="row g-4">

    <div class="col-md-4">
      <div class="card border h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/7/7a/Attack_on_Titan_cover.jpg" class="img-fluid">
        <div class="card-body">
          <h5>AOT</h5>
          <p>⭐ 9.1</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card border h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/9/9e/Fullmetal_Alchemist_Brotherhood.jpg" class="img-fluid">
        <div class="card-body">
          <h5>FMA</h5>
          <p>⭐ 9.1</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card border h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/2/2f/The_Mentalist_title_card.jpg" class="img-fluid">
        <div class="card-body">
          <h5>Mentalist</h5>
          <p>⭐ 8.1</p>
        </div>
      </div>
    </div>

  </div>

</main>

<script src="init.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
