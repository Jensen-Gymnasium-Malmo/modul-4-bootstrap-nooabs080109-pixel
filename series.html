<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<main class="container mt-5">

  <h2 class="mb-4 text-center">📺 My Top Series</h2>

  <div class="row g-4">

    <div class="col-md-4">
      <div class="card shadow-lg h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/7/7a/Attack_on_Titan_cover.jpg" class="card-img-top">
        <div class="card-body">
          <h5>Attack on Titan</h5>
          <p>IMDb: 9.1 / 10</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-lg h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/9/9e/Fullmetal_Alchemist_Brotherhood.jpg" class="card-img-top">
        <div class="card-body">
          <h5>Fullmetal Alchemist: Brotherhood</h5>
          <p>IMDb: 9.1 / 10</p>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-lg h-100">
        <img src="https://upload.wikimedia.org/wikipedia/en/2/2f/The_Mentalist_title_card.jpg" class="card-img-top">
        <div class="card-body">
          <h5>The Mentalist</h5>
          <p>IMDb: 8.1 / 10</p>
        </div>
      </div>
    </div>

  </div>

</main>

<script src="init.js"></script>
</body>
</html>
